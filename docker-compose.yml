# SkillSwap local orchestration.
#
# Spins up PostgreSQL, the Django REST backend and the nginx-served React
# frontend. Optional Redis profile enables the shared cache/counters backend.
#
# Usage:
#   cp .env.example .env   # then edit secrets as needed
#   docker compose up --build
#
# Services:
#   frontend  http://localhost:8080   (SPA + proxy to backend)
#   backend   http://localhost:8000   (Django /api, /admin, /schema)
#   db        PostgreSQL on port 5432 (host port mapped for tooling)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-skillswap_db}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-skillswap_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-skillswap_db}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      # In-container the backend is reached by nginx (frontend) directly.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Static/media are written here and served by nginx from the same volumes.
      STATIC_ROOT: /static
      MEDIA_ROOT: /media
    volumes:
      - static_files:/static
      - media_files:/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Bind the port so the API can be reached from the host too.
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined by Vite at build time; the nginx proxy exposes /api/v1 so the
        # relative default needs no host configuration.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    volumes:
      # Serve Django's static/media directly through nginx.
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Optional profile: shared cache/throttle backend.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  static_files:
  media_files:
